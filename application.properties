spring.application.name=video-transcode-queue

# H2 in-memory DB - swap for Postgres in production (see README)
spring.datasource.url=jdbc:h2:mem:transcodequeue;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

server.port=${SERVER_PORT:8081}

# Number of concurrent worker threads pulling from the in-memory queue.
# In production this maps to N worker containers each consuming from a
# shared SQS queue / RabbitMQ channel instead of N threads in one JVM.
transcode.worker-count=${WORKER_COUNT:3}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
